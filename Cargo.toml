[package]
name = "cgpanel"
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Free, self-hosted Rust hosting control panel"

[[bin]]
name = "cgpanel"
path = "src/main.rs"

[[bin]]
name = "cgpanel-agent"
path = "src/agent.rs"

[[bin]]
name = "cgpanel-egress"
path = "src/egress.rs"

[[bin]]
name = "cgpanel-acme-hook"
path = "src/acme_hook.rs"

[[bin]]
name = "cgpanel-workspace"
path = "src/workspace.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks", "multipart", "stream"] }
scraper = "0.24"
zip = { version = "4", default-features = false, features = ["deflate"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
ipnet = "2"
libc = "0.2"
rand = "0.8"
percent-encoding = "2"
hmac = "0.12"
quick-xml = "0.38"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
