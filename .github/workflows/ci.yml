name: Rust checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:css && npm run check:ui
      - run: git diff --exit-code -- web/style.css
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: CGPANEL_DNS_FIXTURE_OUT=/tmp/cgpanel-generated.zone cargo test --locked
      - run: cargo build --locked --bin cgpanel-workspace && python3 tests/workspace.py
      - run: cargo build --locked --bin cgpanel && python3 tests/admin_api.py
      - run: python3 tests/package_manager.py && python3 tests/updater_errors.py
      - run: python3 tests/release_features.py && python3 tests/monitor_alerts.py
      - run: npx playwright install --with-deps chromium
      - run: python3 tests/browser_features.py
      - run: python3 tests/analytics.py && python3 tests/mfa.py && python3 tests/protection.py
      - run: python3 tests/sftp_policy.py && python3 tests/firewall_migration.py
      - run: python3 -m py_compile tests/*.py deploy/*.py
      - run: python3 scripts/build_api_docs.py --check
      - run: bash -n deploy/install.sh deploy/install-features.sh deploy/upgrade-v0.2.sh deploy/reload-nginx
      - run: docker build -t cgpanel-integration -f tests/host-tools.Dockerfile tests
      - run: docker run --rm -v "$GITHUB_WORKSPACE:/project:ro" -e CGPANEL_DISPOSABLE_TEST=1 cgpanel-integration sh -c 'mkdir -p /run/mysqld && chown mysql:mysql /run/mysqld && python3 tests/host_tools.py'
      - run: docker run --rm -v "$GITHUB_WORKSPACE:/project:ro" -e CGPANEL_DISPOSABLE_TEST=1 cgpanel-integration python3 tests/cache.py
      - run: docker run --rm -v /tmp/cgpanel-generated.zone:/generated.zone:ro cgpanel-integration named-checkzone example.com /generated.zone
      - run: docker build -t cgpanel-mail-test -f tests/mail-tools.Dockerfile tests
      - run: docker run --rm --network none --add-host mail.cgpanel.test:127.0.0.1 -v "$GITHUB_WORKSPACE:/project:ro" -e CGPANEL_DISPOSABLE_TEST=1 cgpanel-mail-test python3 tests/mail_protocols.py
      - run: bash tests/build_upgrade_baseline.sh
      - run: docker build -t cgpanel-upgrade-test -f tests/upgrade-tools.Dockerfile tests
      - name: Verify legacy upgrade, preflight failure and rollback
        run: |
          set -e
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          for scenario in success prepare-failure setup-failure; do
            docker run --rm --network none -v "$GITHUB_WORKSPACE:/project:ro" -v "$GITHUB_WORKSPACE/target:/candidate:ro" \
              -e CGPANEL_DISPOSABLE_TEST=1 -e CGPANEL_UPGRADE_LEGACY_BINARY=/candidate/upgrade-baseline-cgpanel \
              -e CGPANEL_UPGRADE_NEW_BIN_DIR=/candidate/debug -e "CGPANEL_UPGRADE_NEW_VERSION=$version" \
              cgpanel-upgrade-test python3 tests/upgrade.py "$scenario"
          done
